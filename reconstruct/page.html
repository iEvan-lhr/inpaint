<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Title}}</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#1c2e41;background:#eef2f5;--accent:#167888}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select,a{touch-action:manipulation}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:13px 24px;border-bottom:1px solid #dce3e9;background:#ffffffed;backdrop-filter:blur(14px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand-icon{display:grid;place-items:center;width:34px;height:38px;border:1px solid #cbd9df;border-radius:6px;color:var(--accent);font-weight:700;background:#f2f8f8}.brand b{display:block;font-size:14px}.brand small{display:block;color:#7b8997;font-size:11px;margin-top:3px}
.modes{display:flex;padding:3px;gap:2px;background:#edf2f5;border-radius:8px}.modes button{border:0;background:transparent;padding:8px 12px;border-radius:6px;color:#566879;font-size:13px;cursor:pointer}.modes button[aria-pressed=true]{background:white;color:#176878;box-shadow:0 1px 4px #173b4820;font-weight:600}
.actions{display:flex;align-items:center;gap:8px}.action,select{border:1px solid #d4dde4;border-radius:6px;background:#fff;color:#3e5264;padding:8px 10px;font-size:12px;cursor:pointer}.action:hover{border-color:#61a4ac}.action[aria-pressed=true]{background:#e4f4f1;color:#106c63;border-color:#8ec2ba}
.intro{max-width:1000px;margin:22px auto 16px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6e7d8b}.intro a{color:#386e7c;text-decoration:none}.intro a:hover{text-decoration:underline}
#pages{display:grid;gap:26px;padding:0 24px 36px;overflow-x:auto}.sheet-wrap{position:relative;margin:0 auto;box-shadow:0 7px 30px #20354313;border:1px solid #dce3e8;background:white;flex-shrink:0}
.sheet{position:absolute;left:0;top:0;background:white;transform-origin:top left;overflow:hidden}.paper-image{position:absolute;inset:0;width:100%;height:100%;user-select:none;pointer-events:none}.source-image{display:none}.text-layer{position:absolute;inset:0}.line{position:absolute;left:0;top:0;white-space:pre;font-family:"Segoe UI","Microsoft YaHei",sans-serif;line-height:1;transform-origin:0 0;font-kerning:normal}.baseline{display:inline-block;height:0;width:0;vertical-align:baseline}.line ::selection,.line::selection{background:#6dc6df88;color:#122735}
.box-layer{position:absolute;inset:0;pointer-events:none;display:none}.box{position:absolute;border:1px solid #e85e87;background:#f4568910}.box::after{content:attr(data-id);position:absolute;top:-13px;left:0;font:10px/12px "Segoe UI",sans-serif;color:#c52257;background:#fff9;padding:0 2px}
body[data-mode=original] .source-image{display:block}body[data-mode=original] .background-image,body[data-mode=original] .text-layer,body[data-mode=background] .text-layer{display:none}body[data-boxes=true] .box-layer{display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;padding:10px 20px;background:#1a3444;color:white;border-radius:8px;font-size:13px;box-shadow:0 4px 18px #0002}#toast:empty{display:none}
dialog{width:min(900px,calc(100% - 32px));border:1px solid #cfdae0;border-radius:12px;padding:22px;color:#23394c;box-shadow:0 24px 80px #102b4933}dialog::backdrop{background:#182b4266}dialog h2{font-size:18px;margin:0}dialog p{font-size:13px;color:#657887;line-height:1.7}.dialog-head{display:flex;align-items:center;justify-content:space-between}dialog textarea{width:100%;height:55vh;resize:vertical;border:1px solid #dae3e8;border-radius:6px;background:#f8fafb;padding:14px;font:12px/1.6 Consolas,monospace;white-space:pre}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
@media(max-width:850px){.toolbar{padding:10px 12px;gap:10px}.brand small{display:none}.actions{margin-left:auto}.toolbar .modes{order:3;width:100%}.modes button{flex:1}.intro{margin:14px auto;padding:0 14px;gap:12px}#pages{padding:0 12px 24px;gap:16px}.action{padding:8px}.optional{display:none}}
@media print{@page{size:A4;margin:0}body{background:white}.toolbar,.intro,#toast,dialog{display:none!important}#pages{display:block;padding:0;overflow:visible}.sheet-wrap{width:210mm!important;height:297mm!important;border:0;box-shadow:none;margin:0;break-after:page;page-break-after:always}.sheet-wrap:last-child{break-after:auto;page-break-after:auto}.sheet{transform:scale(var(--print-scale))!important}.source-image,.box-layer{display:none!important}.background-image,.text-layer{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body data-mode="reconstructed" data-boxes="false">
<header class="toolbar">
 <div class="brand"><span class="brand-icon" aria-hidden="true">H</span><div><b>{{.Title}}</b><small id="page-count">HTML 重建</small></div></div>
 <nav class="modes" aria-label="预览模式"><button data-mode="reconstructed" aria-pressed="true">重建 HTML</button><button data-mode="original" aria-pressed="false">原图</button><button data-mode="background" aria-pressed="false">去字背景</button></nav>
 <div class="actions"><button id="boxes" class="action" aria-pressed="false">文字框</button><button id="copy" class="action">复制正文</button><button id="print" class="action">打印</button><select id="zoom" aria-label="缩放"><option value="fit">适合宽度</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select></div>
</header>
<div class="intro"><span id="mode-description">按原版重建，文字可选中、复制。</span><a id="show-data" href="#data">查看文字与坐标 JSON ↗</a></div>
<main id="pages" aria-label="重建文档"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="data-dialog"><div class="dialog-head"><h2>文字与坐标 JSON</h2><button id="close-data" class="action" aria-label="关闭数据窗口">关闭</button></div><p>文字位置来自 Go 检测；ink_bounds 是 Go 测量的笔画边界。preserved 列出保留在背景中的区域与原因。</p><textarea id="json-data" readonly spellcheck="false" aria-label="重建数据 JSON"></textarea><div class="dialog-actions"><button class="action" id="download-data">下载 JSON</button></div></dialog>
<dialog id="copy-dialog"><div class="dialog-head"><h2>复制正文</h2><button id="close-copy" class="action">关闭</button></div><p>浏览器限制了自动复制。正文已选中，可按 Ctrl+C（Mac 使用 ⌘C）复制。</p><textarea id="copy-text" readonly aria-label="可复制的正文"></textarea></dialog>
<script id="document-data" type="application/json">{{.Data}}</script>
<script>
'use strict';
const documentData=JSON.parse(document.getElementById('document-data').textContent);
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');
const family='"Segoe UI", "Microsoft YaHei", sans-serif';
const pages=document.getElementById('pages');
document.getElementById('page-count').textContent=`HTML 重建 / ${documentData.pages.length} 页`;
const measurements=[];
function metrics(runs,size){
 let advance=0,ascent=0,descent=0,left=0,right=0;
 runs.forEach((run,index)=>{ctx.font=`${run.bold?700:400} ${size}px ${family}`;const m=ctx.measureText(run.text);if(index===0)left=m.actualBoundingBoxLeft;right=advance+m.actualBoundingBoxRight;advance+=m.width;ascent=Math.max(ascent,m.actualBoundingBoxAscent);descent=Math.max(descent,m.actualBoundingBoxDescent);});
 return {advance,ascent,descent,left,right,width:right+left};
}
function fitText(el,span){
 const box=span.ink_bounds;
 const sample=metrics(span.runs,100);
 const size=box.height/Math.max(1,sample.ascent+sample.descent)*100;
 const m=metrics(span.runs,size);
 el.style.fontSize=size+'px';
 const marker=el.querySelector('.baseline');
 const baseline=marker.offsetTop;
 const sx=box.width/Math.max(1,m.width);
 el.style.left=(box.x+m.left*sx)+'px';
 el.style.top=(box.y+m.ascent-baseline)+'px';
 el.style.transform=`scaleX(${sx})`;
 measurements.push({page:Number(el.dataset.page),region:el.dataset.region,size,scaleX:sx,x:box.x,y:box.y,width:box.width,height:box.height});
}
function render(){
 for(const page of documentData.pages){
  const wrap=document.createElement('section');wrap.className='sheet-wrap';wrap.setAttribute('aria-label',`第 ${page.number} 页`);
  const sheet=document.createElement('div');sheet.className='sheet';sheet.style.width=page.width+'px';sheet.style.height=page.height+'px';sheet.style.setProperty('--print-scale',Math.min(793.7/page.width,1122.52/page.height));
  const bg=document.createElement('img');bg.className='paper-image background-image';bg.src=page.background;bg.alt='';bg.draggable=false;
  const orig=document.createElement('img');orig.className='paper-image source-image';orig.src=page.original;orig.alt=`原图，第 ${page.number} 页`;orig.draggable=false;
  const layer=document.createElement('div');layer.className='text-layer';
  const boxes=document.createElement('div');boxes.className='box-layer';boxes.setAttribute('aria-hidden','true');
  sheet.append(bg,orig,layer,boxes);wrap.append(sheet);pages.append(wrap);
  for(const line of page.lines){
   for(const span of line.spans){
    const el=document.createElement('span');el.className='line';el.dataset.page=page.number;el.dataset.region=line.region_id;el.style.color=span.color;
    for(const run of span.runs){const part=document.createElement(run.bold?'strong':'span');part.textContent=run.text;part.style.fontWeight=run.bold?'700':'400';el.append(part);}
    const baseline=document.createElement('i');baseline.className='baseline';baseline.setAttribute('aria-hidden','true');el.append(baseline);layer.append(el);fitText(el,span);
   }
   const xs=line.go_region.polygon.map(p=>p.x),ys=line.go_region.polygon.map(p=>p.y);
   const box=document.createElement('div');box.className='box';box.dataset.id=`${page.number}.${line.region_id}`;box.style.left=Math.min(...xs)+'px';box.style.top=Math.min(...ys)+'px';box.style.width=(Math.max(...xs)-Math.min(...xs))+'px';box.style.height=(Math.max(...ys)-Math.min(...ys))+'px';boxes.append(box);
  }
 }
 resize();document.body.dataset.ready='true';
}
function resize(){
 const selected=document.getElementById('zoom').value;
 const available=document.documentElement.clientWidth-(document.documentElement.clientWidth<=850?26:50);
 document.querySelectorAll('.sheet-wrap').forEach((wrap,i)=>{const p=documentData.pages[i];const scale=selected==='fit'?Math.min(0.86,available/p.width):Number(selected);wrap.style.width=(p.width*scale)+'px';wrap.style.height=(p.height*scale)+'px';wrap.querySelector('.sheet').style.transform=`scale(${scale})`;});
}
document.querySelectorAll('.modes button').forEach(button=>button.addEventListener('click',()=>{
 document.body.dataset.mode=button.dataset.mode;
 document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 document.getElementById('mode-description').textContent={reconstructed:'按原版重建，文字可选中、复制。',original:'原始图片，用于对照文字与版式。',background:'Go 代码生成的去字背景，文字层已隐藏。'}[button.dataset.mode];
}));
document.getElementById('boxes').addEventListener('click',event=>{const on=document.body.dataset.boxes!=='true';document.body.dataset.boxes=String(on);event.currentTarget.setAttribute('aria-pressed',String(on));});
document.getElementById('zoom').addEventListener('change',resize);window.addEventListener('resize',resize);
document.getElementById('print').addEventListener('click',()=>window.print());
let toastTimer;function toast(s){document.getElementById('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',2600);}
document.getElementById('copy').addEventListener('click',async()=>{
 const text=documentData.pages.map(p=>p.lines.map(l=>l.text).join('\n')).join('\n\n');
 const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.left='-10000px';document.body.append(field);field.select();
 let copied=false;try{copied=document.execCommand('copy');}catch{}finally{field.remove();}
 if(copied){toast('正文已复制');return;}
 try{await Promise.race([navigator.clipboard.writeText(text),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Clipboard timeout')),1500))]);toast('正文已复制');}
 catch{const box=document.getElementById('copy-text');box.value=text;document.getElementById('copy-dialog').showModal();box.focus();box.select();}
});
document.getElementById('close-copy').addEventListener('click',()=>document.getElementById('copy-dialog').close());
function exportData(){const data=structuredClone(documentData);data.pages.forEach(p=>{delete p.original;delete p.background;delete p.number;});return JSON.stringify(data,null,2);}
document.getElementById('show-data').addEventListener('click',event=>{event.preventDefault();document.getElementById('json-data').value=exportData();document.getElementById('data-dialog').showModal();});
document.getElementById('close-data').addEventListener('click',()=>document.getElementById('data-dialog').close());
document.getElementById('download-data').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([exportData()],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='reconstruction.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.fonts.ready.then(render).catch(error=>{document.getElementById('mode-description').textContent='排版失败：'+error.message;});
</script>
</body>
</html>
